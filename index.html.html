<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inner Weather</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--ink:#1d2b3a;--glass:rgba(255,255,255,.55);--line:rgba(0,0,0,.15);
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:#5ec3ff;transition:color .8s}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 18px 64px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(2rem,8vw,3rem);line-height:1.05;margin:12px 0 6px}
.sub{margin:0 0 22px;opacity:.85}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood{font:inherit;color:inherit;background:var(--glass);border:1.5px solid transparent;border-radius:14px;padding:12px 6px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s,border-color .2s}
.mood span{display:block;font-size:1.6rem}
.mood:hover{transform:translateY(-2px)}
.mood[aria-pressed=true]{border-color:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.card{margin-top:16px;background:var(--glass);border-radius:18px;padding:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
textarea{width:100%;min-height:96px;resize:vertical;font:inherit;color:inherit;background:transparent;border:0;border-bottom:1.5px solid var(--line);padding:4px 0 10px;margin-bottom:12px}
textarea::placeholder{color:inherit;opacity:.55}
textarea:focus{outline:none;border-color:var(--ink)}
.save{font:inherit;font-weight:600;background:var(--ink);color:var(--glass-solid,#fff);border:0;border-radius:999px;padding:10px 22px;cursor:pointer}
.save:disabled{opacity:.4;cursor:not-allowed}
h2{font-family:Fraunces,Georgia,serif;font-size:1.3rem;margin:32px 0 8px}
.entry{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.entry .ic{font-size:1.5rem}
.entry b{font-weight:600}
.entry time{font-size:.85rem;opacity:.7;margin-left:6px}
.entry p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.entry .body{flex:1;min-width:0}
.del{align-self:flex-start;font:inherit;font-size:.85rem;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;opacity:.75}
.del:hover{opacity:1;border-color:var(--ink)}
.empty{opacity:.8}
.toast{min-height:1.2em;margin-left:12px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.mood{transition:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <h1>Inner Weather</h1>
  <p class="sub">Pick how you feel. The sky follows.</p>
  <div class="moods" id="moods" role="group" aria-label="Mood"></div>
  <div class="card">
    <textarea id="note" placeholder="What’s behind this feeling? (optional)"></textarea>
    <button class="save" id="save" disabled>Save entry</button><span class="toast" id="toast" role="status"></span>
  </div>
  <h2>Past skies</h2>
  <div id="log"></div>
</main>
<script>
(()=>{
const MOODS={
 joyful:{l:'Joyful',e:'☀️',top:[84,190,255],bot:[255,230,160],fx:'sparkle',ink:'#16283a',glass:'rgba(255,255,255,.6)'},
 calm:{l:'Calm',e:'⛅',top:[140,208,230],bot:[232,245,240],fx:'cloud',ink:'#173238',glass:'rgba(255,255,255,.6)'},
 anxious:{l:'Anxious',e:'🌬️',top:[96,102,134],bot:[190,172,205],fx:'wind',ink:'#fff',glass:'rgba(30,28,50,.5)'},
 sad:{l:'Sad',e:'🌧️',top:[62,78,102],bot:[134,148,168],fx:'rain',ink:'#fff',glass:'rgba(20,28,44,.5)'},
 angry:{l:'Angry',e:'⛈️',top:[34,18,28],bot:[170,52,42],fx:'storm',ink:'#fff',glass:'rgba(25,10,14,.55)'},
 tired:{l:'Tired',e:'🌙',top:[18,24,56],bot:[64,66,112],fx:'stars',ink:'#fff',glass:'rgba(12,14,36,.5)'}
};
const cv=document.getElementById('sky'),cx=cv.getContext('2d');
let W,H,cur=null,top=[...MOODS.joyful.top],bot=[...MOODS.joyful.bot],parts=[],flash=0;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;spawn()}
addEventListener('resize',resize);
const R=(a,b)=>a+Math.random()*(b-a);
function spawn(){
  const fx=cur?MOODS[cur].fx:'sparkle';parts=[];
  const n={sparkle:60,cloud:7,wind:40,rain:140,storm:220,stars:110}[fx];
  for(let i=0;i<n;i++)parts.push({x:R(0,W),y:R(0,H),s:R(.5,1),p:R(0,6.28)});
}
function draw(t){
  const m=MOODS[cur||'joyful'];
  for(let i=0;i<3;i++){top[i]+=(m.top[i]-top[i])*.04;bot[i]+=(m.bot[i]-bot[i])*.04}
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${top.map(Math.round)})`);g.addColorStop(1,`rgb(${bot.map(Math.round)})`);
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  const fx=m.fx;
  if(fx==='sparkle'){
    cx.fillStyle='rgba(255,246,200,.9)';cx.beginPath();cx.arc(W*.82,H*.14,46+Math.sin(t/900)*3,0,6.28);cx.fill();
    parts.forEach(p=>{p.y-=.25*p.s;if(p.y<0)p.y=H;cx.fillStyle=`rgba(255,255,255,${.3+.5*Math.abs(Math.sin(t/700+p.p))})`;cx.fillRect(p.x,p.y,2*p.s,2*p.s)});
  }
  if(fx==='cloud'||fx==='storm'||fx==='wind'||fx==='rain'){
    const k=fx==='cloud'?.25:fx==='wind'?1.6:.4,dark=fx==='storm'?.5:fx==='rain'?.35:0;
    parts.slice(0,7).forEach((p,i)=>{
      p.x+=k*p.s;if(p.x>W+200)p.x=-200;
      const y=H*(.08+i*.08),c=Math.round(255*(1-dark));
      const rg=cx.createRadialGradient(p.x,y,5,p.x,y,150*p.s+40);
      rg.addColorStop(0,`rgba(${c},${c},${c},.55)`);rg.addColorStop(1,`rgba(${c},${c},${c},0)`);
      cx.fillStyle=rg;cx.fillRect(p.x-220,y-160,440,320);
    });
  }
  if(fx==='wind'){
    cx.strokeStyle='rgba(255,255,255,.35)';cx.lineWidth=1.5;
    parts.forEach(p=>{p.x+=9*p.s;if(p.x>W+80){p.x=-80;p.y=R(0,H)}
      cx.beginPath();cx.moveTo(p.x,p.y+Math.sin(t/200+p.p)*4);cx.lineTo(p.x-60*p.s,p.y);cx.stroke()});
  }
  if(fx==='rain'||fx==='storm'){
    const st=fx==='storm';cx.strokeStyle=st?'rgba(255,255,255,.45)':'rgba(200,220,255,.5)';cx.lineWidth=1.2;
    parts.forEach(p=>{p.y+=(st?18:11)*p.s;p.x-=st?4:1;if(p.y>H){p.y=-20;p.x=R(0,W+80)}
      cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x+(st?4:1.5),p.y-(st?18:12)*p.s);cx.stroke()});
    if(st){if(Math.random()<.006)flash=1;if(flash>0){cx.fillStyle=`rgba(255,240,220,${flash*.5})`;cx.fillRect(0,0,W,H);flash-=.06}}
  }
  if(fx==='stars'){
    cx.fillStyle='#f4efd8';cx.beginPath();cx.arc(W*.8,H*.13,28,0,6.28);cx.fill();
    cx.fillStyle=`rgb(${top.map(Math.round)})`;cx.beginPath();cx.arc(W*.8+11,H*.13-6,26,0,6.28);cx.fill();
    parts.forEach(p=>{cx.fillStyle=`rgba(255,255,255,${.2+.8*Math.abs(Math.sin(t/1100*p.s+p.p))})`;cx.fillRect(p.x,p.y*.8,1.8*p.s,1.8*p.s)});
  }
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches||!draw.once){draw.once=1;requestAnimationFrame(draw)}
}
// UI
const box=document.getElementById('moods'),note=document.getElementById('note'),save=document.getElementById('save'),
log=document.getElementById('log'),toast=document.getElementById('toast');
let entries=[];
try{entries=JSON.parse(localStorage.getItem('innerweather')||'[]')}catch(e){}
Object.entries(MOODS).forEach(([k,m])=>{
  const b=document.createElement('button');b.className='mood';b.setAttribute('aria-pressed','false');b.dataset.k=k;
  b.innerHTML=`<span>${m.e}</span>${m.l}`;b.onclick=()=>setMood(k);box.appendChild(b);
});
function setMood(k){
  cur=k;const m=MOODS[k];
  document.documentElement.style.setProperty('--ink',m.ink);
  document.documentElement.style.setProperty('--glass',m.glass);
  document.documentElement.style.setProperty('--glass-solid',m.ink==='#fff'?'#1b1b2a':'#fff');
  box.querySelectorAll('.mood').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
  save.disabled=false;spawn();
}
save.onclick=()=>{
  if(!cur)return;
  entries.unshift({k:cur,n:note.value.trim(),d:Date.now()});
  try{localStorage.setItem('innerweather',JSON.stringify(entries.slice(0,100)))}catch(e){}
  note.value='';toast.textContent='Entry saved';setTimeout(()=>toast.textContent='',2000);render();
};
function render(){
  log.innerHTML='';
  if(!entries.length){log.innerHTML='<p class="empty">No entries yet. Pick a mood and save your first one.</p>';return}
  entries.forEach((e,i)=>{
    const m=MOODS[e.k],d=document.createElement('div');d.className='entry';
    const when=new Date(e.d).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    d.innerHTML=`<div class="ic">${m.e}</div><div class="body"><b>${m.l}</b><time>${when}</time><p></p></div><button class="del" aria-label="Delete this entry">Delete</button>`;
    d.querySelector('.del').onclick=()=>{
      entries.splice(i,1);
      try{localStorage.setItem('innerweather',JSON.stringify(entries))}catch(err){}
      toast.textContent='Entry deleted';setTimeout(()=>toast.textContent='',2000);render();
    };
    d.querySelector('p').textContent=e.n||'No note';
    log.appendChild(d);
  });
}
render();resize();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
